<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlothLog — Engineering Worklogs & Timesheet Clustering</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #0e131f;
      --surface-elevated: #141b2c;
      --border: #1b2333;
      --border-hover: #2d3b55;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #10b981;
      --accent-dim: rgba(16, 185, 129, 0.12);
      --accent-border: rgba(16, 185, 129, 0.3);
      --blue: #3b82f6;
      --blue-dim: rgba(59, 130, 246, 0.12);
      --danger: #ef4444;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.5;
      padding: 32px 24px;
      max-width: 1140px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
    }
    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-version {
      font-size: 10px;
      font-family: var(--font-mono);
      background: var(--surface-elevated);
      color: var(--text-dim);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    input, button {
      font-family: inherit;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 7px 12px;
      outline: none;
      transition: all 0.15s ease;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    button {
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.btn-primary {
      background: #10b981;
      color: #052e16;
      border-color: #10b981;
      font-weight: 600;
    }
    button.btn-primary:hover:not(:disabled) {
      background: #059669;
      border-color: #059669;
    }
    button.btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    button.btn-secondary {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text-muted);
    }
    button.btn-secondary:hover:not(:disabled) {
      background: var(--surface-elevated);
      color: var(--text);
      border-color: var(--border-hover);
    }

    /* Switch toggle */
    .switch-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .toggle-switch {
      position: relative;
      width: 32px;
      height: 18px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border);
      transition: .2s;
      border-radius: 18px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--accent);
    }
    input:checked + .slider:before {
      transform: translateX(14px);
    }

    /* Stats Overview */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-dim);
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: #fff;
      margin-top: 4px;
    }

    /* Scanning Progress Feedback Banner */
    #scanProgressBanner {
      display: none;
      background: var(--surface-elevated);
      border: 1px solid var(--accent-border);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 20px;
      animation: fadeIn 0.2s ease-out;
    }
    .progress-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .progress-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      font-size: 13px;
      color: #fff;
    }
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #3b82f6 50%, #10b981 100%);
      background-size: 200% 100%;
      animation: moveGradient 1.5s linear infinite;
    }
    @keyframes moveGradient {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* Spinner */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(5, 46, 22, 0.3);
      border-top-color: #052e16;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Timesheet List */
    .timesheet-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .timeslot-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.15s ease;
    }
    .timeslot-card:hover {
      border-color: var(--border-hover);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ticket-chip {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      background: var(--accent-dim);
      color: #34d399;
      border: 1px solid var(--accent-border);
      letter-spacing: 0.3px;
    }
    .repo-chip {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface-elevated);
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid var(--border);
    }

    /* Stepper */
    .stepper {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .stepper button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .stepper button:hover {
      background: var(--surface-elevated);
      color: var(--text);
    }
    .stepper span {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
      padding: 0 10px;
      min-width: 48px;
      text-align: center;
    }

    /* Summary textarea */
    .summary-field {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }
    .summary-field:focus {
      border-color: var(--border-hover);
      background: #0b101c;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-dim);
      flex-wrap: wrap;
      gap: 8px;
    }
    .action-group {
      display: flex;
      gap: 6px;
    }
    .btn-action {
      font-size: 11.5px;
      padding: 5px 10px;
      color: var(--text-muted);
      background: var(--surface-elevated);
      border-color: var(--border);
    }
    .btn-action:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }

    details {
      font-size: 11.5px;
      color: var(--text-dim);
    }
    details summary {
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    details summary:hover {
      color: var(--text-muted);
    }
    details ul {
      margin-top: 8px;
      margin-left: 18px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }
    details li { margin-bottom: 2px; }

    /* Skeleton Loading Cards */
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .skeleton-line {
      height: 14px;
      background: linear-gradient(90deg, #131926 25%, #1c2538 50%, #131926 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 7, 13, 0.75);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-backdrop.active { display: flex; }
    .modal-dialog {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 90%;
      max-width: 540px;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .modal-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .repo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      margin-bottom: 18px;
    }
    .repo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface-elevated);
      color: #fff;
      border: 1px solid var(--accent-border);
      font-size: 12.5px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: none;
      z-index: 9999;
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">S</div>
      <div>
        <div class="brand-title">
          SlothLog
          <span class="brand-version">v1.0</span>
        </div>
        <div class="brand-subtitle">Git-backed engineering worklogs & timesheet clustering</div>
      </div>
    </div>
    <div class="header-controls">
      <div class="system-status" title="Local AI Inference via Ollama">
        <span class="pulse-dot"></span>
        <span>Gemma 2 2B (Local)</span>
      </div>
      <input type="date" id="datePicker" />
      <label class="switch-label" title="Filter timeslots to show only active repositories">
        <div class="toggle-switch">
          <input type="checkbox" id="chkActiveOnly" checked />
          <span class="slider"></span>
        </div>
        <span>Active only</span>
      </label>
      <button class="btn-primary" id="btnScan">
        <span id="btnScanIcon">⚡</span>
        <span id="btnScanText">Scan Commits</span>
      </button>
      <button class="btn-secondary" id="btnRepos">Tracked Repos</button>
      <button class="btn-secondary" id="btnExport">Export CSV</button>
    </div>
  </header>

  <!-- Live Scan Progress Banner -->
  <div id="scanProgressBanner">
    <div class="progress-content">
      <div class="progress-status">
        <div class="spinner"></div>
        <span id="scanProgressText">Analyzing git commit logs across active repositories...</span>
      </div>
      <span style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted);" id="scanProgressStep">1 / 2</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-label">Logged Hours</div>
      <div class="stat-value" id="statHours">0.00 h</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Clustered Tickets</div>
      <div class="stat-value" id="statTickets">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Estimated Time Saved</div>
      <div class="stat-value" id="statSaved">~0 mins</div>
    </div>
  </div>

  <div class="timesheet-list" id="timesheetContainer">
    <!-- Timeslot items rendered dynamically -->
  </div>

  <!-- Repositories Drawer / Modal -->
  <div class="modal-backdrop" id="repoModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Tracked Git Repositories</h3>
        <button class="btn-secondary" style="padding: 2px 8px; font-size: 11px;" id="btnCloseRepoModal">✕</button>
      </div>
      <div class="repo-list" id="repoListContainer">
        <!-- Repos list rendered dynamically -->
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <input type="text" id="newRepoPath" placeholder="Repository local path (e.g. D:/Work/billing-service)" />
        <input type="text" id="newRepoName" placeholder="Friendly Name (optional)" />
        <button class="btn-primary" id="btnAddRepo" style="justify-content: center;">+ Add Repository</button>
      </div>
    </div>
  </div>

  <div id="toast">Copied to clipboard</div>

  <script>
    let currentDate = "2026-10-20";
    let timeslots = [];

    const datePicker = document.getElementById("datePicker");
    const timesheetContainer = document.getElementById("timesheetContainer");
    const statHours = document.getElementById("statHours");
    const statTickets = document.getElementById("statTickets");
    const statSaved = document.getElementById("statSaved");
    const toast = document.getElementById("toast");
    const chkActiveOnly = document.getElementById("chkActiveOnly");

    const btnScan = document.getElementById("btnScan");
    const btnScanIcon = document.getElementById("btnScanIcon");
    const btnScanText = document.getElementById("btnScanText");
    const scanProgressBanner = document.getElementById("scanProgressBanner");
    const scanProgressText = document.getElementById("scanProgressText");
    const scanProgressStep = document.getElementById("scanProgressStep");

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 2500);
    }

    async function loadTimeslots() {
      try {
        const activeOnly = chkActiveOnly.checked;
        const res = await fetch(`/api/timeslots?date=${currentDate}&active_only=${activeOnly}`);
        const data = await res.json();
        timeslots = data.timeslots || [];
        renderTimeslots();
      } catch (err) {
        console.error("Failed to load timeslots:", err);
      }
    }

    function renderSkeletons() {
      timesheetContainer.innerHTML = `
        <div class="skeleton-card">
          <div style="display:flex; gap:10px; width:40%;">
            <div class="skeleton-line" style="width:70px; height:20px;"></div>
            <div class="skeleton-line" style="width:120px; height:20px;"></div>
          </div>
          <div class="skeleton-line" style="width:100%; height:38px; margin: 6px 0;"></div>
          <div class="skeleton-line" style="width:30%; height:14px;"></div>
        </div>
        <div class="skeleton-card">
          <div style="display:flex; gap:10px; width:40%;">
            <div class="skeleton-line" style="width:70px; height:20px;"></div>
            <div class="skeleton-line" style="width:120px; height:20px;"></div>
          </div>
          <div class="skeleton-line" style="width:100%; height:38px; margin: 6px 0;"></div>
          <div class="skeleton-line" style="width:30%; height:14px;"></div>
        </div>
      `;
    }

    function renderTimeslots() {
      timesheetContainer.innerHTML = "";
      if (timeslots.length === 0) {
        timesheetContainer.innerHTML = `
          <div style="text-align:center; padding: 48px 20px; color: var(--text-dim); background: var(--surface); border-radius: 8px; border: 1px dashed var(--border);">
            <p style="font-size: 15px; font-weight: 600; color: #fff;">No recorded timeslots for ${currentDate}</p>
            <p style="margin-top: 6px; font-size: 12.5px;">Click <b>Scan Commits</b> above to inspect local git history, or change dates.</p>
          </div>
        `;
        statHours.textContent = "0.00 h";
        statTickets.textContent = "0";
        statSaved.textContent = "~0 mins";
        return;
      }

      let totalHours = 0;
      timeslots.forEach(slot => {
        totalHours += slot.hours;
        const card = document.createElement("div");
        card.className = "timeslot-card";
        
        const commitsHtml = (slot.raw_commits && slot.raw_commits.length) 
          ? `<details>
               <summary>${slot.raw_commits.length} underlying commits</summary>
               <ul>${slot.raw_commits.map(c => `<li>${c}</li>`).join("")}</ul>
             </details>`
          : "";

        card.innerHTML = `
          <div class="card-top">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="ticket-chip">${slot.ticket_id}</span>
              <span class="repo-chip">${slot.repo_name}</span>
            </div>
            <div class="stepper">
              <button onclick="adjustHours('${slot.id}', -0.25)">-</button>
              <span>${slot.hours.toFixed(2)}h</span>
              <button onclick="adjustHours('${slot.id}', 0.25)">+</button>
            </div>
          </div>
          <div>
            <textarea class="summary-field" rows="2" onblur="updateSummary('${slot.id}', this.value)">${slot.summary}</textarea>
          </div>
          ${commitsHtml}
          <div class="card-footer">
            <span>Logged date: ${slot.date}</span>
            <div class="action-group">
              <button class="btn-secondary btn-action" onclick="copyJiraFormat('${slot.id}')">Copy for Jira / ADO</button>
              <button class="btn-secondary btn-action" onclick="copySummaryOnly('${slot.id}')">Copy Summary</button>
              <button class="btn-secondary btn-action" style="color:var(--danger);" onclick="deleteTimeslot('${slot.id}')" title="Delete this timeslot card">Delete</button>
            </div>
          </div>
        `;
        timesheetContainer.appendChild(card);
      });

      statHours.textContent = `${totalHours.toFixed(2)} h`;
      statTickets.textContent = `${timeslots.length}`;
      statSaved.textContent = `~${Math.round(timeslots.length * 15)} mins`;
    }

    async function adjustHours(id, delta) {
      const slot = timeslots.find(s => s.id === id);
      if (!slot) return;
      const newHours = Math.max(0.25, Math.round((slot.hours + delta) * 100) / 100);
      try {
        await fetch(`/api/timeslots/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ hours: newHours, summary: slot.summary })
        });
        slot.hours = newHours;
        renderTimeslots();
        showToast(`Hours updated to ${newHours.toFixed(2)}h`);
      } catch (err) {
        console.error("Failed to update hours:", err);
      }
    }

    async function updateSummary(id, text) {
      const slot = timeslots.find(s => s.id === id);
      if (!slot || slot.summary === text) return;
      try {
        await fetch(`/api/timeslots/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ hours: slot.hours, summary: text })
        });
        slot.summary = text;
        showToast("Summary updated");
      } catch (err) {
        console.error("Failed to update summary:", err);
      }
    }

    function copyJiraFormat(id) {
      const slot = timeslots.find(s => s.id === id);
      if (!slot) return;
      const text = `[${slot.ticket_id}] ${slot.hours.toFixed(2)}h: ${slot.summary}`;
      navigator.clipboard.writeText(text).then(() => {
        showToast("Copied formatted timesheet line");
      });
    }

    function copySummaryOnly(id) {
      const slot = timeslots.find(s => s.id === id);
      if (!slot) return;
      navigator.clipboard.writeText(slot.summary).then(() => {
        showToast("Copied summary to clipboard");
      });
    }

    async function deleteTimeslot(id) {
      try {
        await fetch(`/api/timeslots/${id}`, { method: "DELETE" });
        showToast("Timeslot removed");
        await loadTimeslots();
      } catch (err) {
        console.error("Failed to delete timeslot:", err);
      }
    }


    // Modal
    const repoModal = document.getElementById("repoModal");
    const btnRepos = document.getElementById("btnRepos");
    const btnCloseRepoModal = document.getElementById("btnCloseRepoModal");
    const repoListContainer = document.getElementById("repoListContainer");
    const btnAddRepo = document.getElementById("btnAddRepo");
    const newRepoPath = document.getElementById("newRepoPath");
    const newRepoName = document.getElementById("newRepoName");

    btnRepos.onclick = async () => {
      repoModal.classList.add("active");
      await loadRepos();
    };
    btnCloseRepoModal.onclick = () => repoModal.classList.remove("active");

    async function loadRepos() {
      try {
        const res = await fetch("/api/repos?include_inactive=true");
        const repos = await res.json();
        repoListContainer.innerHTML = "";
        if (repos.length === 0) {
          repoListContainer.innerHTML = `<div style="color:var(--text-dim); font-size:12px; padding: 12px; text-align:center;">No repositories configured yet.</div>`;
          return;
        }
        repos.forEach(r => {
          const item = document.createElement("div");
          item.className = "repo-row";
          const isActive = r.active !== 0;
          item.innerHTML = `
            <div style="display:flex; align-items:center; gap:12px;">
              <label class="switch-label">
                <div class="toggle-switch">
                  <input type="checkbox" ${isActive ? "checked" : ""} onchange="toggleRepo('${r.id}', this.checked)" />
                  <span class="slider"></span>
                </div>
              </label>
              <div>
                <strong style="${isActive ? '' : 'color:var(--text-dim); text-decoration:line-through;'}">${r.name}</strong>
                <span style="font-size:10px; margin-left:6px; font-family:var(--font-mono); color:${isActive ? 'var(--accent)' : 'var(--text-dim)'}">${isActive ? 'Active' : 'Disabled'}</span>
                <div style="color:var(--text-dim); font-size:11px; font-family:var(--font-mono);">${r.path}</div>
              </div>
            </div>
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px; color:var(--danger);" onclick="deleteRepo('${r.id}')">Remove</button>
          `;
          repoListContainer.appendChild(item);
        });
      } catch (err) {
        console.error("Failed to load repos:", err);
      }
    }

    async function toggleRepo(id, isChecked) {
      try {
        await fetch(`/api/repos/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ active: isChecked })
        });
        showToast(isChecked ? "Repository activated" : "Repository deactivated");
        await loadRepos();
        await loadTimeslots();
      } catch (err) {
        console.error("Failed to toggle repo:", err);
      }
    }

    async function deleteRepo(id) {
      try {
        await fetch(`/api/repos/${id}`, { method: "DELETE" });
        await loadRepos();
        await loadTimeslots();
        showToast("Repository removed");
      } catch (err) {
        console.error("Failed to delete repo:", err);
      }
    }

    btnAddRepo.onclick = async () => {
      const path = newRepoPath.value.trim();
      const name = newRepoName.value.trim();
      if (!path) return;
      try {
        await fetch("/api/repos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path, name: name || undefined })
        });
        newRepoPath.value = "";
        newRepoName.value = "";
        await loadRepos();
        await loadTimeslots();
        showToast("Repository added");
      } catch (err) {
        console.error("Failed to add repo:", err);
      }
    };

    // Scan with live feedback
    btnScan.onclick = async () => {
      // Enter loading state
      btnScan.disabled = true;
      btnScanIcon.innerHTML = `<span class="spinner"></span>`;
      btnScanText.textContent = "Scanning...";
      scanProgressBanner.style.display = "block";
      scanProgressText.textContent = "Inspecting git histories across active repositories...";
      scanProgressStep.textContent = "Step 1 of 2";

      renderSkeletons();

      // Staged progress simulation
      const progressTimer = setTimeout(() => {
        scanProgressText.textContent = "Clustering work sessions & generating executive summaries...";
        scanProgressStep.textContent = "Step 2 of 2";
      }, 700);

      try {
        const res = await fetch(`/api/scan?date=${currentDate}`);
        clearTimeout(progressTimer);
        const data = await res.json();
        timeslots = data.timeslots || [];
        renderTimeslots();

        scanProgressText.textContent = `Scan complete: ${data.generated_timeslots || 0} timeslots generated!`;
        scanProgressStep.textContent = "Done";
        setTimeout(() => {
          scanProgressBanner.style.display = "none";
        }, 1800);
      } catch (err) {
        console.error("Scan error:", err);
        clearTimeout(progressTimer);
        scanProgressBanner.style.display = "none";
        showToast("Scan failed. Check terminal logs.");
        loadTimeslots();
      } finally {
        btnScan.disabled = false;
        btnScanIcon.textContent = "⚡";
        btnScanText.textContent = "Scan Commits";
      }
    };

    document.getElementById("btnExport").onclick = () => {
      window.location.href = `/api/export?date=${currentDate}&active_only=${chkActiveOnly.checked}`;
    };

    chkActiveOnly.onchange = () => {
      loadTimeslots();
    };

    datePicker.value = currentDate;
    datePicker.onchange = (e) => {
      currentDate = e.target.value;
      loadTimeslots();
    };

    // Initial load
    loadTimeslots();
  </script>
</body>
</html>
